<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extension Review Desk — CWS Policy & Malware Auditor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#e9edf3;--pn:#fff;--ink:#172033;--mu:#5b667a;--ln:#d3dae6;--critical:#c4203a;--high:#d9541e;--medium:#b7791f;--low:#2f6fd6;--ok:#1b7f5c;--ac:#243b7a}
*{box-sizing:border-box;margin:0}
body{font:14px/1.55 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:60px}
h1,h2,.vt{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif}
header{background:var(--pn);border-bottom:1px solid var(--ln);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:19px}header p{font-size:12px;color:var(--mu)}
.pill{font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--ln)}
.pill.on{color:var(--ok);border-color:var(--ok)}
main{max-width:1000px;margin:0 auto;padding:26px 18px}
.dz{background:var(--pn);border:2px dashed #9aa7bf;border-radius:12px;padding:38px;text-align:center;cursor:pointer}
.dz:hover,.dz.ov{border-color:var(--ac);background:#f3f6fd}.dz b{font:700 18px Georgia,serif}.dz p{color:var(--mu);margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
label{font-weight:600;font-size:13px;display:block;margin-bottom:5px}label small{font-weight:400;color:var(--mu)}
textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--ln);border-radius:8px;font:inherit;resize:vertical}
textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.go{margin-top:18px;width:100%;padding:14px;border:0;border-radius:9px;background:var(--ac);color:#fff;font:700 15px inherit;cursor:pointer}
.go:disabled{background:#a9b3c7;cursor:not-allowed}
.btn{padding:7px 14px;border:1px solid var(--ln);background:var(--pn);border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
.err{background:#fde8eb;color:var(--critical);padding:11px;border-radius:8px;margin-top:12px}
.hide{display:none}
.st{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin:8px auto;max-width:460px;color:var(--mu)}
.st.on{color:var(--ink);border-color:var(--ac);font-weight:600}.st.ok{color:var(--ok)}
.vd{background:var(--pn);border:1px solid var(--ln);border-left:8px solid var(--c);border-radius:10px;padding:22px 26px;margin-bottom:16px}
.vt{font-size:28px;font-weight:700;color:var(--c)}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ln);margin:16px 0 8px}
.bar i{display:block}.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px}
.lg span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.note{font-size:12px;color:var(--mu);margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}
h2{font-size:19px;margin:26px 0 10px}
.pol{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pol div{background:var(--pn);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:8px;padding:10px 12px}
.pol b{display:block;font-size:13px}.pol span{font-size:12px;color:var(--c);font-weight:700}
.f{background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:8px;margin-bottom:9px}
.f summary{padding:11px 14px;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.f summary b{flex:1 1 100%}.tag{font-size:11.5px;font-weight:700;color:var(--c)}.loc,.cf{font-size:11.5px;color:var(--mu);font-family:ui-monospace,Consolas,monospace}
.fb{padding:0 14px 14px}.fb p{margin-bottom:8px}.cap{font:600 11.5px ui-monospace,Consolas,monospace;color:var(--mu);margin:8px 0 3px}
pre{background:#101626;color:#d6deef;border-radius:7px;overflow-x:auto;font:12px/1.6 ui-monospace,Consolas,monospace;padding:6px 0}
pre span{display:block;padding:0 12px;white-space:pre}pre u{text-decoration:none;color:#6d7a96;display:inline-block;width:44px;user-select:none}
pre .hit{background:#4a1a27;color:#fff;box-shadow:inset 3px 0 #ff5c7a}
.ai{background:#eef2fb;border-radius:6px;padding:7px 10px;font-size:12.5px}
.dis{opacity:.6}
table{width:100%;border-collapse:collapse;background:var(--pn);border:1px solid var(--ln);border-radius:8px;font-size:13px}
td,th{padding:8px 12px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{background:#f3f5f9}
td:first-child{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.prose{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px;white-space:pre-wrap}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.vd{animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style></head><body>
<header><div><h1>Extension Review Desk</h1><p>Chrome Web Store policy &amp; malware audit — static analysis + on-device Gemini triage</p></div><span id="badge" class="pill">Checking Gemini…</span></header>
<main>
<section id="up">
 <div class="dz" id="dz" tabindex="0"><input type="file" id="fi" accept=".crx,.zip" class="hide"><b>Drop a .crx or .zip extension package</b><p id="fn">or click to browse</p></div>
 <div id="err" class="err hide"></div>
 <div class="cols"><div><label for="desc">Store description <small>(checked against the permissions and against what the code actually does)</small></label><textarea id="desc"></textarea></div>
 <div><label for="priv">Privacy policy <small>(optional — every external POST, WebSocket or beacon call must be disclosed here; local calls are exempt)</small></label><textarea id="priv"></textarea></div></div>
 <button class="go" id="go" disabled>Audit extension</button>
</section>
<section id="an" class="hide" style="text-align:center;padding-top:40px"><h2>Auditing package…</h2><div id="steps"></div></section>
<section id="rp" class="hide"></section>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEV={critical:40,high:18,medium:6,low:1},CF={high:1,medium:.6,low:.25},ORD=['critical','high','medium','low'];
const CAT={mal:'Malware',rhc:'Remotely hosted code',obf:'Obfuscation',udp:'User data & privacy',perm:'Permissions & manifest'};
const COL={critical:'#c4203a',high:'#d9541e',medium:'#b7791f',low:'#2f6fd6',ok:'#1b7f5c'};

/* ── Detection rules: weak = noisy inside minified/vendor code, so confidence drops ── */
const R=[
{id:'roblox',cat:'mal',sev:'critical',policy:'Malware: cookie theft',title:'Roblox session cookie (.ROBLOSECURITY) access',why:'This cookie logs a user into Roblox. Reading it in an extension is a known account-takeover technique.',re:/\.ROBLOSECURITY/g},
{id:'aikey',cat:'mal',sev:'high',policy:'Malware: information theft (MALWARE_OTHER_INFORMATION_THEFT if sent out)',title:'AI API key in package',why:'A Gemini/OpenAI/Anthropic key is hard-coded or referenced. If harvested from the user and sent to a third party, this is information theft.',re:/AIzaSy[\w-]{33}|sk-(?:proj-|ant-api\d+-)[\w-]{20,}|\b(?:GEMINI|OPENAI|ANTHROPIC)_API_KEY\b/g},
{id:'chess',cat:'mal',sev:'critical',policy:'Malware: chess auto-move',title:'Chess engine / auto-move automation',why:'Engine output (stockfish, bestmove) is wired to a chess site. Automated play is treated as malware.',re:/stockfish|\bbestmove\b|auto[_-]?move/gi,needs:c=>/chess\.com|lichess\.org/i.test(c.all)},
{id:'miner',cat:'mal',sev:'critical',policy:'Prohibited: crypto mining',title:'Cryptocurrency miner signature',why:'Known in-browser mining library or pool reference.',re:/coinhive|coin-hive|cryptonight|cryptoloot|minero\.cc|CoinImp/gi},
{id:'yt',cat:'mal',sev:'high',policy:'Prohibited: YouTube downloader',title:'Direct YouTube stream access',why:'Reads raw YouTube stream endpoints, which the YouTube downloader policy prohibits.',re:/get_video_info|googlevideo\.com|ytInitialPlayerResponse\.streamingData/g},
{id:'proxy',cat:'mal',sev:'high',policy:'Malware: traffic interception',title:'Browser proxy settings overwritten',why:'chrome.proxy.settings.set reroutes all browsing through an attacker-controlled host if misused.',re:/chrome\.proxy\.settings\.set/g},
{id:'wallet',cat:'mal',sev:'medium',policy:'Malware: clipboard hijack',title:'Hard-coded crypto wallet address near clipboard code',why:'Clipboard-swapping malware replaces copied addresses with the attacker’s wallet.',re:/\b(?:bc1[a-z0-9]{25,60}|0x[a-fA-F0-9]{40})\b/g,needs:c=>/clipboard|oncopy/i.test(c.all)},
{id:'eval',cat:'rhc',sev:'high',policy:'RHC #6: dynamic code evaluation',title:'eval() / new Function()',why:'Executes strings as code. Allowed only in sandboxed pages, and a hard violation if the string comes from a remote source.',re:/(?<![.\w$])eval\s*\(|new\s+Function\s*\(/g,weak:1},
{id:'rscript',cat:'rhc',sev:'critical',policy:'RHC #1: remote script',title:'Remote <script src> in an extension page',why:'Extension pages must not load JavaScript from the network.',re:/<script[^>]+src\s*=\s*["']?https?:\/\//gi,files:/\.html?$/},
{id:'rimport',cat:'rhc',sev:'critical',policy:'RHC #1: remote script',title:'importScripts()/import() from a remote URL',why:'Loads executable code from a server the developer controls after review.',re:/(?:importScripts|import)\s*\(\s*['"`]https?:\/\//g},
{id:'dscript',cat:'rhc',sev:'high',policy:'RHC #4: dynamic script element',title:'Dynamic <script> element creation',why:'Builds script tags at runtime, a common vehicle for remote code.',re:/createElement\s*\(\s*['"`]script['"`]\s*\)/g,weak:1},
{id:'sdk',cat:'rhc',sev:'high',policy:'RHC #2: bundled SDK with remote fetch',title:'Bundled SDK that fetches remote workers/scripts',why:'SDKs such as Tesseract (workerPath), Mellowtel or Whatfix can pull code at runtime. Enforceable even when unused.',re:/workerPath\s*:|mellowtel|whatfix/gi},
{id:'ast',cat:'rhc',sev:'high',policy:'RHC #3: custom interpreter',title:'Custom JS/AST interpreter (Sval)',why:'An interpreter lets remote “data” act as code, bypassing the MV3 remote-code ban.',re:/\bSval\b|new\s+Interpreter\s*\(/g},
{id:'dnrcsp',cat:'rhc',sev:'high',policy:'RHC #5: CSP stripping',title:'Content-Security-Policy header manipulation',why:'Removing page CSP headers enables injected remote scripts.',re:/content-security-policy/gi,files:/\.(?:js|mjs|json)$/,skip:/(^|\/)manifest\.json$|_locales/},
{id:'b64eval',cat:'obf',sev:'critical',policy:'Obfuscation: encoded execution',title:'eval/Function over atob() payload',why:'Decodes a hidden payload and runs it.',re:/(?:eval|Function)\s*\(\s*atob\s*\(/g},
{id:'packer',cat:'obf',sev:'critical',policy:'Obfuscation: packer',title:'Dean Edwards packer',why:'p,a,c,k,e,d packing hides logic from reviewers.',re:/eval\s*\(\s*function\s*\(\s*p\s*,\s*a\s*,\s*c\s*,\s*k\s*,\s*e\s*,\s*[rd]\s*\)/g},
{id:'jsfuck',cat:'obf',sev:'critical',policy:'Obfuscation: symbol encoding',title:'JSFuck / symbol-only encoding',why:'Code written with only []()!+ characters.',re:/\[\]\[\(!\[\]\+\[\]\)|\$=~\[\];\$=\{___:/g},
{id:'hexid',cat:'obf',sev:'high',policy:'Obfuscation: hex identifiers / string array',title:'_0x identifiers (obfuscator.io style)',why:'Machine-generated names and rotating string arrays.',re:/\b_0x[a-f0-9]{4,6}\b/gi,min:8},
{id:'hexesc',cat:'obf',sev:'high',policy:'Obfuscation: escape encoding',title:'Long \\x escape sequences',why:'Strings hidden as hex escapes.',re:/(?:\\x[0-9a-f]{2}){8,}/gi},
{id:'uniesc',cat:'obf',sev:'high',policy:'Obfuscation: escape encoding',title:'Long \\u escape sequences (non-localization)',why:'Unicode escapes outside translation files hide strings. Locale dictionaries are exempt.',re:/(?:\\u[0-9a-f]{4}){8,}/gi,skip:/_locales|i18n|locale|lang|translat/i,weak:1},
{id:'split',cat:'obf',sev:'high',policy:'Obfuscation: code building',title:'Split-string URL / API construction',why:'Assembles "http", "script" or "document" from fragments to evade review.',re:/['"`]http['"`]\s*\+\s*['"`]:\/\/|['"`]sc['"`]\s*\+\s*['"`]ri['"`]\s*\+\s*['"`]pt['"`]|['"`]doc['"`]\s*\+\s*['"`]ument['"`]/g},
{id:'longvar',cat:'obf',sev:'medium',policy:'Obfuscation: long names',title:'Many 36+ character identifiers',why:'Randomly generated long names are an obfuscation signal.',re:/\b[a-zA-Z_$][\w$]{35,}\b/g,min:6,weak:1},
{id:'fcc',cat:'obf',sev:'medium',policy:'Obfuscation: code building',title:'Repeated String.fromCharCode()',why:'Builds strings from numeric codes.',re:/String\.fromCharCode\s*\(/g,min:4,weak:1},
{id:'dbg',cat:'obf',sev:'medium',policy:'Obfuscation: anti-analysis',title:'debugger statement',why:'Blocks analysts using DevTools.',re:/^\s*debugger\s*;?\s*$/gm},
{id:'blob',cat:'obf',sev:'medium',policy:'Obfuscation: encoded blob',title:'Large base64 string literal',why:'Over 1,200 encoded characters in one string may hide a payload.',re:/["'`][A-Za-z0-9+\/]{1200,}={0,2}["'`]/g,weak:1},
{id:'aff',cat:'udp',sev:'medium',policy:'Deceptive behavior: affiliate injection',title:'Affiliate tracking parameters with navigation code',why:'Rewriting links with affiliate IDs without disclosure violates the affiliate ads policy.',re:/[?&](?:irclickid|cjevent|aff(?:iliate)?_?id|tag)=|\bsubid\b/gi,needs:c=>/tabs\.update|location\.(?:href|assign|replace)/.test(c.all),weak:1}
];
const SRC=[{k:'cookies',sev:'critical',re:/document\.cookie|chrome\.cookies\.(?:get|getAll)\b/},{k:'passwords',sev:'critical',re:/type\s*=\s*["']?password|\[type=["']?password/i},{k:'clipboard',sev:'high',re:/clipboardData\.getData|clipboard\.readText/},{k:'browsing history',sev:'high',re:/chrome\.history\.(?:search|getVisits)|chrome\.tabs\.query\s*\(\s*\{\s*\}/},{k:'page content',sev:'medium',re:/documentElement\.outerHTML|document\.body\.innerText/}];
const NET=/\bfetch\s*\(|navigator\.sendBeacon\s*\(|new\s+WebSocket\s*\(|new\s+XMLHttpRequest|new\s+Image\(\)\.src/;
const PERM={debugger:['critical'],proxy:['critical'],nativeMessaging:['high'],webRequestBlocking:['high',/block|filter|privacy|header/i],cookies:['high',/cookie|session|login|account|auth/i],clipboardRead:['high',/clipboard|paste|copy/i],history:['medium',/history|visited|productiv|track/i],management:['high',/extension|manage/i],browsingData:['medium',/clear|clean|privacy|data/i],webRequest:['medium',/block|privacy|header|network|proxy|redirect|tracker/i],pageCapture:['medium',/save|capture|archive|mhtml/i],tabCapture:['medium',/record|capture|stream|audio/i],desktopCapture:['high',/record|capture|screen/i],downloads:['low',/download|save|export/i],tabs:['low',/tab|window|session|group/i],scripting:['low',/page|inject|style|theme|translate|highlight|autofill|block|modify|tool/i],geolocation:['medium',/weather|map|location|near/i],privacy:['medium',/privacy|webrtc/i],declarativeNetRequest:['low',/block|filter|redirect|header|privacy/i]};
const OK=new Set(['activeTab','storage','notifications','contextMenus','alarms','offscreen','favicon','topSites','unlimitedStorage','sidePanel','identity','bookmarks','sessions','idle','power','fontSettings','tts']);

/* ── helpers ── */
function snip(code,idx,len){
  const ln=(code.slice(0,idx).match(/\n/g)||[]).length+1,a=Math.max(0,idx-500),sub=code.slice(a,idx+len+500).split('\n');
  let pos=a,hit=0;for(let i=0;i<sub.length;i++){if(idx<=pos+sub[i].length){hit=i;break}pos+=sub[i].length+1}
  const col=idx-pos;
  return {line:ln,lines:sub.map((t,i)=>{if(t.length>200){const c=i===hit?Math.max(0,col-80):0;t=(c?'…':'')+t.slice(c,c+200)+'…'}return{n:ln-hit+i,t,hit:i===hit}}).slice(Math.max(0,hit-2),hit+3)}
}
const inComment=(code,i)=>{const s=code.lastIndexOf('\n',i-1)+1,p=code.slice(s,i);return /^\s*(\/\/|\*|\/\*)/.test(p)||/(^|[\s;{}])\/\/[^'"]*$/.test(p)&&!/:\/\/[^'"]*$/.test(p)};
let FID=0;
const mk=(o)=>({id:'F'+(++FID),count:1,conf:'high',snips:[],...o});
const mkSnip=(label,code,i,l)=>{const s=snip(code,i,l);return{label,line:s.line,lines:s.lines}};

function scan(files,ctx){
  const out=[];
  for(const [name,code] of Object.entries(files)){
    if(!/\.(?:js|mjs|html?|json)$/.test(name)||code.length>3e6)continue;
    const isMin=code.length>2000&&code.length/(code.split('\n').length)>300,vendor=/vendor|node_modules|\blib\b|\.min\./i.test(name);
    for(const r of R){
      if((r.files&&!r.files.test(name))||(r.skip&&r.skip.test(name))||(r.needs&&!r.needs(ctx))||(!r.files&&/\.json$/.test(name)&&r.id!=='dnrcsp'))continue;
      const hits=[];let n=0;
      for(const m of code.matchAll(r.re)){if(!/\.html?$/.test(name)&&inComment(code,m.index))continue;n++;if(hits.length<2)hits.push(m)}
      if(!n||n<(r.min||1))continue;
      const conf=r.weak&&(isMin||vendor)?'low':(r.weak?'medium':'high');
      out.push(mk({cat:r.cat,sev:r.sev,policy:r.policy,title:r.title,why:r.why,file:name,line:null,count:n,conf,rule:r.id,snips:hits.map(m=>mkSnip(`${name}:${snip(code,m.index,0).line}`,code,m.index,m[0].length))}));
      out[out.length-1].line=out[out.length-1].snips[0].line;
    }
    /* source → network flow inside one file (possible exfiltration) */
    if(!/\.(?:js|mjs|html?)$/.test(name))continue;
    const net=code.match(NET),ext=/https?:\/\/(?!localhost|127\.0\.0\.1)[\w.-]+\.[a-z]{2,}/i.test(code);
    if(net&&ext)for(const s of SRC){const m=code.match(s.re);if(!m)continue;
      const ni=code.search(NET);
      out.push(mk({cat:'mal',sev:s.sev==='medium'?'medium':'high',policy:'Malware: data exfiltration (verify)',conf:s.sev==='critical'?'medium':'low',rule:'flow',title:`Reads ${s.k} and makes external requests in the same file`,why:`This file both collects ${s.k} and sends network requests to external hosts. Confirm that the request body does not contain this data and that it is disclosed in the privacy policy.`,file:name,line:snip(code,m.index,0).line,snips:[mkSnip(`source: ${s.k}`,code,m.index,m[0].length),mkSnip('network sink',code,ni,6)]}));}
    /* RHC #1: remote data → unsanitized DOM sink (localization & local templates are false positives) */
    if(/\bfetch\s*\(|XMLHttpRequest/.test(code)&&!/_locales|i18n|translat/i.test(name)){
      const re=/\.(?:innerHTML|outerHTML)\s*=|insertAdjacentHTML\s*\(|document\.write\s*\(/g;
      for(const m of code.matchAll(re)){const w=code.slice(Math.max(0,m.index-700),m.index+200);
        if(/\.json\s*\(|\.text\s*\(|response|payload|remote/i.test(w)&&!/DOMPurify|sanitize|escapeHtml|chrome\.i18n/i.test(w)){
          out.push(mk({cat:'rhc',sev:'high',conf:'medium',policy:'RHC: remote source + unsanitized sink',title:'Network response written into the DOM unsanitized',why:'Data fetched from a server reaches innerHTML/document.write with no sanitizer nearby. If that data can contain script or markup, it is remotely hosted code.',file:name,line:snip(code,m.index,0).line,rule:'domsink',snips:[mkSnip(`${name}`,code,m.index,m[0].length)]}));break}}}
  }
  return out;
}

function manifestChecks(m,mtext,ctx){
  const out=[],at=(k)=>{const i=mtext.indexOf(`"${k}"`);return i<0?[]:[mkSnip('manifest.json',mtext,i,k.length+2)]};
  const csp=typeof m.content_security_policy==='string'?m.content_security_policy:Object.values(m.content_security_policy||{}).join(' ; ');
  if(/unsafe-eval|script-src[^;]*https?:\/\//i.test(csp))out.push(mk({cat:'rhc',sev:'critical',policy:'RHC: relaxed extension CSP',title:'Extension CSP allows eval or remote script sources',why:'unsafe-eval or an http(s) script-src lets the extension execute code that was not reviewed.',file:'manifest.json',snips:at('content_security_policy')}));
  if(m.update_url&&!/clients2\.google\.com|google\.com\/service\/update2/.test(m.update_url))out.push(mk({cat:'rhc',sev:'high',policy:'Self-hosted updates',title:'Custom update_url bypasses Web Store review',why:'Updates delivered from your own server are not reviewed.',file:'manifest.json',snips:at('update_url')}));
  if(JSON.stringify(m.externally_connectable||{}).match(/\*|<all_urls>/))out.push(mk({cat:'perm',sev:'medium',conf:'medium',policy:'Permissions: overly broad messaging',title:'externally_connectable accepts any website',why:'Any page can send messages to the extension’s background logic.',file:'manifest.json',snips:at('externally_connectable')}));
  if(m.manifest_version===2)out.push(mk({cat:'perm',sev:'low',policy:'Manifest V2 is deprecated',title:'Manifest V2 package',why:'The Web Store no longer accepts new MV2 items; MV2 also permits remote-code patterns blocked in MV3.',file:'manifest.json',snips:at('manifest_version')}));
  const perms=[...(m.permissions||[]),...(m.optional_permissions||[])].filter(p=>!p.includes('://')&&p!=='<all_urls>'),rows=[];
  for(const p of perms){
    if(OK.has(p)||!PERM[p]){rows.push([p,'ok','Standard permission']);continue}
    const [s,kw]=PERM[p],fits=kw&&kw.test(ctx.purpose);
    if(fits&&!ctx.sink){rows.push([p,'ok','Matches stated purpose']);continue}
    const sev=ctx.sink&&s!=='critical'?ORD[Math.max(0,ORD.indexOf(s)-1)]:s;
    rows.push([p,sev,fits?'Matches purpose, but extension also contacts external servers':'Not explained by the description']);
    if(sev!=='low')out.push(mk({cat:'perm',sev,conf:fits?'low':'medium',policy:'Permissions: least privilege / single purpose',title:`Permission “${p}” ${fits?'combined with external requests':'not justified by description'}`,why:`${p} grants sensitive capability. ${ctx.sink?'The package also contacts external hosts. ':''}${fits?'':'The description does not mention a feature that needs it.'}`,file:'manifest.json',snips:at(p)}))}
  return {out,rows};
}

/* ── outbound data audit: every POST/PUT/WebSocket/beacon must be disclosed and needed; local targets are exempt ── */
const LOCAL=/^(localhost|127[.]|0[.]0[.]0[.]0|[[]|10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.])|[.]local$/i;
const DATA={
'browsing URLs':{re:/location[.]href|[.]url\b|document[.]referrer|tab[.]url/,need:/url|link|site|history|bookmark|tab|translat|search|security|price|coupon|shop|summar|screenshot/i},
'cookies':{re:/cookie/i,need:/cookie|session|login|account/i},
'credentials':{re:/password|passwd|credential|secret/i,need:/password|login|sign.?in|auth|account|vault|manager/i},
'clipboard':{re:/clipboard/i,need:/clipboard|copy|paste/i},
'page content':{re:/innerText|textContent|outerHTML|getSelection|selectionText/,need:/summar|translat|grammar|\bai\b|gpt|gemini|chat|ask|extract|ocr|speech|scrap|note/i},
'user input':{re:/FormData|(?:input|textarea|field|query|prompt)\w*[.]value/i,need:/form|autofill|translat|grammar|search|chat|\bai\b|note|write|message|feedback/i},
'device identifiers':{re:/userAgent|deviceId|device_id|uuid|fingerprint|clientId|installId/i,need:/sync|account|licen|premium|subscription|sign.?in/i},
'analytics/telemetry':{re:/analytics|telemetry|gtag|mixpanel|amplitude|sentry/i,need:/(?!)/}};
const POL={'browsing URLs':/url|browsing|website|link|page/i,'cookies':/cookie/i,'credentials':/password|credential|login/i,'clipboard':/clipboard/i,'page content':/content|text|page|website/i,'user input':/input|text|prompt|message|form/i,'device identifiers':/identifier|device|browser|user agent/i,'analytics/telemetry':/analytics|telemetry|usage|diagnostic/i};
const NETHINT=/online|cloud|sync|server|api\b|\bai\b|gpt|gemini|openai|translat|search|weather|price|login|account|backup|share|upload|real.?time|licen|subscription/i;

function dest(code,from){
  const a=code.slice(from,from+300).trimStart(),lit=/^([\x22\x27\x60])([^\x22\x27\x60\n]*)/.exec(a);let s=lit?lit[2]:'';
  if(!lit){const id=(/^[\w$.]+/.exec(a)||[''])[0];if(!id)return'unknown';
    const r=new RegExp('(?:^|[^A-Za-z0-9_$.])'+id.replace(/[.$]/g,'[$&]')+'[ ]*[:=][ ]*[\x22\x27\x60]([^\x22\x27\x60\n]*)').exec(code);s=r?r[1]:''}
  const m=/^(?:https?|wss?):[/][/]([^/:?#$]+)/i.exec(s);return m?m[1].toLowerCase():/^[/]/.test(s)?'skip':'unknown'}

function outbound(files,ctx){
  const P=ctx.priv,Pl=(P||'').toLowerCase(),pur=ctx.purpose,hasDesc=pur.length>60,G={};
  for(const [name,code] of Object.entries(files)){
    if(!/[.](?:js|mjs|html?)$/.test(name)||code.length>3e6)continue;
    const calls=[];
    for(const m of code.matchAll(/(?<![.\w$])fetch\s*\(/g)){const w=code.slice(m.index,m.index+500),me=/method\s*:\s*[\x22\x27\x60](POST|PUT|PATCH|DELETE)/i.exec(w);if(me||/\bbody\s*:/.test(w))calls.push([m,me?me[1].toUpperCase():'POST'])}
    for(const m of code.matchAll(/[.]open\s*\(\s*[\x22\x27\x60](POST|PUT|PATCH)[\x22\x27\x60]\s*,/gi))calls.push([m,m[1].toUpperCase()]);
    for(const [re,t] of [[/navigator[.]sendBeacon\s*\(/g,'BEACON'],[/new\s+WebSocket\s*\(/g,'WEBSOCKET'],[/new\s+Image\(\)[.]src\s*=/g,'IMG-BEACON']])for(const m of code.matchAll(re))calls.push([m,t]);
    for(const [m,t] of calls){
      const host=dest(code,m.index+m[0].length);if(host==='skip')continue;
      const w=code.slice(Math.max(0,m.index-400),m.index+600),k=host+'|'+t,g=G[k]||(G[k]={host,method:t,n:0,cats:new Set(),where:[],snips:[],file:name,line:0});
      Object.keys(DATA).filter(c=>DATA[c].re.test(w)).forEach(c=>g.cats.add(c));
      const s=mkSnip(`${name}:${snip(code,m.index,0).line}`,code,m.index,m[0].length);
      g.n++;g.where.push(s.label);if(g.snips.length<2)g.snips.push(s);if(!g.line){g.line=s.line;g.file=name}
    }
  }
  const rows=[],findings=[],SENS=['cookies','credentials','clipboard','browsing URLs'];
  for(const g of Object.values(G)){
    const local=LOCAL.test(g.host),cats=[...g.cats],bad=cats.filter(c=>!DATA[c].need.test(pur)),lab=g.host.split('.').slice(-2,-1)[0]||g.host;
    const hostOK=!!P&&(Pl.includes(g.host)||Pl.includes(lab)||/third.?part|service provider|our servers?|remote server/i.test(P)),miss=P?cats.filter(c=>!POL[c].test(P)):[];
    const disc=local?'Local — exempt':!P?'No policy':hostOK&&!miss.length?'Yes':hostOK?'Partly':'No';
    const need=local?'—':cats.length?(bad.length?'No: '+bad.join(', '):'Yes'):NETHINT.test(pur)?'Unclear':'No: no online feature described';
    rows.push({host:g.host,local,method:g.method,count:g.n,cats,disc,need,where:g.where});
    if(local)continue;
    const notReq=need.startsWith('No'),sev=notReq?(bad.some(c=>SENS.includes(c))?'critical':'high'):!P?'high':disc==='Yes'?null:'medium';
    if(!sev)continue;
    const why=[!P?'No privacy policy was supplied, yet this call sends data off the device.':'',P&&!hostOK?`The policy neither names ${g.host} nor says data goes to third-party or remote servers.`:'',miss.length?`The policy does not describe the data being sent: ${miss.join(', ')}.`:'',notReq?`Not required for the stated functionality${bad.length?' ('+bad.join(', ')+')':''}: the description does not explain why this data leaves the device. Collection must be limited to what the single purpose needs.`:''].filter(Boolean).join(' ');
    findings.push(mk({cat:'udp',sev,conf:g.host==='unknown'||(notReq&&!hasDesc)?'medium':'high',rule:'outbound',policy:notReq?'User Data policy: data not required for functionality':'User Data policy: undisclosed data transmission',title:`${g.method} to ${g.host==='unknown'?'an unresolved host':g.host} sends ${cats.join(', ')||'unspecified data'}`,why,file:g.file,line:g.line,count:g.n,snips:g.snips}));
  }
  if(P&&rows.some(r=>!r.local)&&/(?:do not|don't|never)\s+(?:collect|transmit|share|sell|send)/i.test(P))findings.push(mk({cat:'udp',sev:'high',conf:'medium',policy:'User Data policy: misleading statement',title:'Policy denies collection but the code transmits data externally',why:'The policy says data is not collected or shared, while POST/WebSocket calls to external hosts exist (see the outbound table).',file:'privacy policy'}));
  return {rows,findings};
}

/* ── on-device Gemini: triage the evidence, never invent findings ── */
async function aiTriage(ctx,F){
  const api=self.LanguageModel||(self.ai&&self.ai.languageModel);if(!api)return null;
  const top=[...F].sort((a,b)=>SEV[b.sev]-SEV[a.sev]).slice(0,10).map(f=>({id:f.id,policy:f.policy,file:f.file,code:(f.snips[0]?f.snips[0].lines.map(l=>l.t).join('\n'):f.why).slice(0,320)}));
  const sys='You are a Chrome Web Store reviewer. Judge each finding only from the code shown and the stated purpose. Remote code, obfuscation (not minification), and exfiltration of cookies, keys or personal data are violations. Localization strings and local-only DOM rendering are false positives. Also compare the description with what the code does and flag behavior the description does not explain.';
  const prompt=`Extension: ${ctx.name}\nPurpose: ${ctx.purpose.slice(0,500)}\nFindings: ${JSON.stringify(top)}\nReply with JSON only: {"summary":"two sentences","purpose_match":"yes|partial|no","triage":[{"id":"F1","verdict":"confirmed|likely_false_positive|needs_human","reason":"one sentence"}]}`;
  try{let s;try{s=await api.create({initialPrompts:[{role:'system',content:sys}],expectedOutputs:[{type:'text',languages:['en']}]})}catch{s=await api.create({systemPrompt:sys})}
    const t=await s.prompt(prompt);s.destroy&&s.destroy();return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}catch(e){return{error:String(e.message||e)}}
}

/* ── UI ── */
let file=null,gem=false;
(async()=>{const b=$('badge');try{const api=self.LanguageModel||(self.ai&&self.ai.languageModel);if(api){const a=api.availability?await api.availability():(await api.capabilities()).available;if(a&&a!=='unavailable'&&a!=='no'){gem=true;b.textContent='Gemini on-device ready';b.className='pill on';return}}}catch{}
  b.textContent='Gemini unavailable — static engine only';b.title='Enable chrome://flags/#prompt-api-for-gemini-nano and relaunch'})();
const dz=$('dz'),show=id=>['up','an','rp'].forEach(x=>$(x).classList.toggle('hide',x!==id));
dz.onclick=()=>$('fi').click();dz.onkeydown=e=>{if(e.key==='Enter')$('fi').click()};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('ov')};dz.ondragleave=()=>dz.classList.remove('ov');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('ov');pick(e.dataTransfer.files[0])};$('fi').onchange=e=>pick(e.target.files[0]);
function pick(f){if(!f)return;if(!/\.(crx|zip)$/i.test(f.name)){$('err').textContent='Choose a .crx or .zip file.';$('err').classList.remove('hide');return}
  $('err').classList.add('hide');file=f;$('fn').textContent=`${f.name} — ${(f.size/1048576).toFixed(2)} MB`;$('go').disabled=false}
$('go').onclick=run;
const STEPS=['Unpack package','Scan code for malware, RHC and obfuscation','Check manifest, permissions and privacy policy','Triage evidence with on-device Gemini','Build report'];
const step=n=>{$('steps').innerHTML=STEPS.map((s,i)=>`<div class="st ${i<n?'ok':i===n?'on':''}">${i<n?'✓':i===n?'…':'○'} ${s}</div>`).join('')};
const tick=()=>new Promise(r=>setTimeout(r,60));

async function run(){
  show('an');step(0);await tick();FID=0;
  try{
    let buf=await file.arrayBuffer();const u=new Uint8Array(buf);
    if(u[0]===67&&u[1]===114&&u[2]===50&&u[3]===52){let i=12+new DataView(buf).getUint32(8,true);if(u[i]!==80){for(i=0;i<u.length-3&&!(u[i]===80&&u[i+1]===75&&u[i+2]===3&&u[i+3]===4);i++);}buf=buf.slice(i)}
    const zip=await JSZip.loadAsync(buf),files={},paths=[];
    for(const [n,e] of Object.entries(zip.files)){if(e.dir)continue;paths.push(n);if(/\.(js|mjs|json|html?|css)$/i.test(n)){try{files[n]=await e.async('string')}catch{}}}
    const cands=Object.keys(files).filter(n=>/(^|\/)manifest\.json$/.test(n)&&!/node_modules|_locales/.test(n)).map(n=>{try{const j=JSON.parse(files[n].replace(/^\uFEFF/,'').replace(/^[ \t]*\/\/.*$/gm,''));return j&&j.manifest_version?{n,j,d:n.split('/').length}:null}catch{return null}}).filter(Boolean);
    if(!cands.length)throw new Error('No manifest.json with a manifest_version was found. The archive starts with: '+paths.slice(0,5).join(', ')+'. Upload the packed extension (.crx or .zip).');
    const fx=c=>/gecko|firefox|applications/i.test(c.n+JSON.stringify(c.j.browser_specific_settings||c.j.applications||''));
    cands.sort((a,b)=>a.d-b.d||fx(a)-fx(b));
    const mpath=cands[0].n,m=cands[0].j,mtext=files[mpath].replace(/^\uFEFF/,'');
    const first=paths[0].split('/')[0],topDir=paths.every(p=>p.includes('/')&&p.split('/')[0]===first)?first+'/':'';
    let notice='';
    if(mpath!=='manifest.json')notice=`Analyzed ${mpath}`+(cands.length>1?` (ignored ${cands.slice(1).map(c=>c.n).join(', ')})`:'')+(mpath.slice(0,-13)!==topDir?'. The manifest is not at the package root, so this looks like a source repository: every script and stylesheet in the archive was scanned. Upload the built package for the most precise review.':'.');
    
    const desc=$('desc').value.trim(),priv=$('priv').value.trim();
    const all=Object.values(files).join('\n'),perms=new Set([...(m.permissions||[]),...(m.optional_permissions||[])]);
    const domains=[...new Set((all.match(/https?:\/\/([\w-]+(?:\.[\w-]+)+)/g)||[]).map(u=>new URL(u).hostname))].filter(h=>!/^(www\.w3\.org|schemas\.|chrome\.google\.com|.*\.?(google|gstatic|googleapis|mozilla|github)\.(com|org)|.*\.?(example|localhost)$)/.test(h));
    const sus=h=>/bit\.ly|tinyurl|ngrok|pastebin|raw\.githubusercontent|herokuapp|\.xyz$|\.top$|\.pw$|\.tk$|\.cc$|^\d+\.\d+\.\d+\.\d+$/.test(h);
    const ctx={all,perms,priv,name:m.name||file.name,purpose:`${m.name||''} ${m.description||''} ${desc}`,sink:NET.test(all)&&domains.length>0};
    step(1);await tick();let F=scan(files,ctx);
    domains.filter(sus).slice(0,3).forEach(h=>{const i=all.indexOf(h);F.push(mk({cat:'mal',sev:'medium',conf:'medium',policy:'Malware: suspicious endpoint',title:`Suspicious host: ${h}`,why:'Paste sites, tunnels, raw file hosts, free TLDs and bare IPs are typical command-and-control or payload hosts.',file:'(source)',snips:[mkSnip('first reference',all,i,h.length)]}))});
    step(2);await tick();const mc=manifestChecks(m,mtext,ctx);mc.out.forEach(f=>{if(f.file==='manifest.json'){f.file=mpath;f.snips.forEach(s=>{if(s.label==='manifest.json')s.label=mpath})}});const ob=outbound(files,ctx);F.push(...mc.out,...ob.findings);
    step(3);await tick();const ai=gem?await aiTriage(ctx,F):null;
    if(ai&&ai.triage)for(const t of ai.triage){const f=F.find(x=>x.id===t.id);if(!f)continue;f.ai={v:t.verdict,reason:t.reason};if(t.verdict==='likely_false_positive'&&f.conf!=='high'&&f.sev!=='critical')f.dismissed=true}
    step(4);await tick();
    render({m,F,rows:mc.rows,domains:domains.map(h=>[h,sus(h)]),ai,paths,ctx,notice,ob:ob.rows,desc:!!desc,priv:!!priv});show('rp');
  }catch(e){$('err').textContent='Audit failed: '+e.message;$('err').classList.remove('hide');show('up')}
}

function render(d){
  const live=d.F.filter(f=>!f.dismissed),score=Math.min(100,Math.round(live.reduce((s,f)=>s+SEV[f.sev]*CF[f.conf],0)));
  const mal=live.some(f=>f.cat==='mal'&&f.sev==='critical'&&f.conf!=='low'),hard=live.some(f=>f.sev==='critical'&&f.conf==='high'),rev=live.some(f=>f.sev==='critical'||f.sev==='high');
  const v=mal?['Reject — malware indicators','critical']:hard||score>=60?['Reject — policy violation','critical']:rev||score>=20?['Manual review needed','medium']:['Approve — no violations found','ok'];
  const cnt=Object.fromEntries(ORD.map(s=>[s,live.filter(f=>f.sev===s).length])),tot=live.length||1;
  const fh=f=>`<details class="f ${f.dismissed?'dis':''}" style="--c:${COL[f.sev]}" ${f.sev==='critical'&&!f.dismissed?'open':''}><summary><b>${esc(f.title)}</b><span class="tag">${f.sev.toUpperCase()} · ${esc(f.policy)}</span><span class="loc">${esc(f.file||'')}${f.line?':'+f.line:''}</span><span class="cf">${f.conf} confidence${f.count>1?` · ${f.count} matches`:''}${f.dismissed?' · dismissed by AI triage':''}</span></summary><div class="fb"><p>${esc(f.why)}</p>${f.snips.map(s=>`<div class="cap">${esc(s.label)}</div><pre>${s.lines.map(l=>`<span class="${l.hit?'hit':''}"><u>${l.n}</u>${esc(l.t)}</span>`).join('')}</pre>`).join('')}${f.ai?`<p class="ai">On-device Gemini: <b>${esc(f.ai.v)}</b> — ${esc(f.ai.reason)}</p>`:''}</div></details>`;
  const sec=Object.entries(CAT).map(([k,t])=>{const L=d.F.filter(f=>f.cat===k).sort((a,b)=>SEV[b.sev]-SEV[a.sev]);return L.length?`<h2>${t} <small style="font-size:13px;color:var(--mu)">(${L.length})</small></h2>${L.map(fh).join('')}`:''}).join('');
  const chk=Object.entries(CAT).map(([k,t])=>{const L=live.filter(f=>f.cat===k),top=ORD.find(s=>L.some(f=>f.sev===s));return`<div style="--c:${top?COL[top]:COL.ok}"><b>${t}</b><span>${top?top.toUpperCase()+' · '+L.length+' finding'+(L.length>1?'s':''):'No issues'}</span></div>`}).join('');
  const obT=d.ob.length?`<table><tr><th>Destination</th><th>Call</th><th>Data sent</th><th>In privacy policy</th><th>Needed for function</th><th>Where</th></tr>${d.ob.map(r=>`<tr><td>${esc(r.host)}</td><td>${esc(r.method)}${r.count>1?' ×'+r.count:''}</td><td>${esc(r.cats.join(', ')||'unspecified')}</td><td style="color:${r.local||r.disc==='Yes'?COL.ok:COL.high};font-weight:700">${esc(r.disc)}</td><td style="color:${r.local||r.need==='Yes'?COL.ok:COL.high};font-weight:700">${esc(r.need)}</td><td style="font:12px ui-monospace,Consolas,monospace">${esc(r.where.slice(0,2).join(', '))}</td></tr>`).join('')}</table>`:'<div class="prose">No POST, WebSocket or beacon calls found.</div>';
  $('rp').innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><button class="btn" onclick="show('up')">← New audit</button><span><button class="btn" id="ex">Export JSON</button> <button class="btn" onclick="print()">Print</button></span></div>
  ${d.notice?`<div class="sub" style="margin:0 0 12px">${esc(d.notice)}</div>`:''}<div class="vd" style="--c:${COL[v[1]]}"><div class="vt">${v[0]}</div><div class="sub">${esc(d.m.name||'')} · Manifest v${d.m.manifest_version} · ${d.paths.length} files · risk score ${score}/100 · ${live.length} active finding${live.length===1?'':'s'}</div>
  <div class="bar">${ORD.map(s=>`<i style="width:${cnt[s]/tot*100}%;background:${COL[s]}"></i>`).join('')}</div><div class="lg">${ORD.map(s=>`<span style="--c:${COL[s]}">${cnt[s]} ${s}</span>`).join('')}</div>
  <div class="note">Static analysis cannot prove an extension is safe: server-side behavior and heavily obfuscated logic can be missed. Treat a Reject as strong evidence to confirm against the snippets below, and treat Approve as “nothing found,” not a guarantee.${d.desc?'':' No store description was provided, so permission justification relies on the manifest text only.'}${d.priv?'':' No privacy policy was provided.'}</div></div>
  <div class="pol">${chk}</div>
  ${d.ai&&d.ai.summary?`<h2>On-device Gemini assessment</h2><div class="prose">${esc(d.ai.summary)}\n\nPurpose match: <b>${esc(d.ai.purpose_match||'n/a')}</b></div>`:d.ai&&d.ai.error?`<div class="note">Gemini triage failed (${esc(d.ai.error)}); results are from the static engine only.</div>`:''}
  ${sec||'<h2>Findings</h2><div class="prose">No findings triggered.</div>'}
  <h2>Outbound data transmission</h2>${obT}<h2>Permissions</h2><table><tr><th>Permission</th><th>Status</th><th>Reasoning</th></tr>${d.rows.map(r=>`<tr><td>${esc(r[0])}</td><td style="color:${COL[r[1]]};font-weight:700">${r[1]==='ok'?'Justified':r[1].toUpperCase()}</td><td>${esc(r[2])}</td></tr>`).join('')||'<tr><td colspan=3>No API permissions declared.</td></tr>'}</table>
  <h2>External hosts referenced</h2><table>${d.domains.map(x=>`<tr><td>${esc(x[0])}</td><td style="color:${x[1]?COL.high:'var(--mu)'}">${x[1]?'Suspicious host type':'Referenced in source'}</td></tr>`).join('')||'<tr><td>None found</td></tr>'}</table>`;
  $('ex').onclick=async()=>{const json=JSON.stringify({verdict:v[0],score,findings:d.F.map(({snips,...f})=>({...f,evidence:snips}))},null,2);
    let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch{}
    if(dl){try{await dl.save({filename:'audit-report.json',data:json})}catch(e){if(e&&e.code!=='declined')alert('Export is unavailable in this view.')}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='audit-report.json';a.click()};
  scrollTo(0,0);
}
</script></body></html>
